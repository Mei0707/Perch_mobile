name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: backend
      - run: npm run eval
        working-directory: backend
      - run: docker build -t perch-api:verification backend
      - run: node backend/verify-container.mjs
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/verify-swift-core.sh --with-backend
      - run: swift test
      - run: ./scripts/verify-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-verification
          path: .verification/ios
          if-no-files-found: ignore
