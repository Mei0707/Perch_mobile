function MiniChart({data,color}){
  if(!data||data.length<2) return null;
  const W=72,H=32,min=Math.min(...data),max=Math.max(...data),rng=max-min||1;
  const xs=data.map((_,i)=>(i/(data.length-1))*W);
  const ys=data.map(v=>H-((v-min)/rng)*(H-6)-3);
  const line=`M ${xs.map((x,i)=>`${x},${ys[i]}`).join(' L ')}`;
  const area=`M ${xs[0]},${H} L ${xs.map((x,i)=>`${x},${ys[i]}`).join(' L ')} L ${xs[xs.length-1]},${H} Z`;
  const id=`mc${color.replace(/[^a-z0-9]/gi,'')}`;
  return <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
    <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.15"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
    <path d={area} fill={`url(#${id})`}/>
    <path d={line} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
  </svg>;
}

function StockChart({data,color,W=340,H=150}){
  if(!data||data.length<2) return null;
  const p=4,min=Math.min(...data),max=Math.max(...data),rng=max-min||1;
  const w=W-p*2,h=H-p*2;
  const xs=data.map((_,i)=>p+(i/(data.length-1))*w);
  const ys=data.map(v=>p+h-((v-min)/rng)*h);
  const pts=xs.map((x,i)=>`${x},${ys[i]}`).join(' L ');
  const id=`sc${color.replace(/[^a-z0-9]/gi,'')}`;
  return <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
    <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.2"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
    <path d={`M ${xs[0]},${p+h} L ${pts} L ${xs[xs.length-1]},${p+h} Z`} fill={`url(#${id})`}/>
    <path d={`M ${pts}`} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
  </svg>;
}

function DonutChart({segs,size=96,sw=18}){
  const r=(size/2)-sw/2,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  let off=0;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
    {segs.map((s,i)=>{
      const dash=(s.pct/100)*circ;
      const el=<circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={sw}
        strokeDasharray={`${dash} ${circ-dash}`} strokeDashoffset={-off}
        style={{transform:'rotate(-90deg)',transformOrigin:`${cx}px ${cy}px`}}/>;
      off+=dash; return el;
    })}
  </svg>;
}

        </div>;
      })}
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════
// APP SHELL (one phone)
// ═══════════════════════════════════════════════════════════
function PerchApp({dark=false,accent='#e07840',onToggleDark,onAccent}){
  const t=useTheme(dark,accent);
  const [nav,setNav]=React.useState('home');
  const [stock,setStock]=React.useState(null);
  const [anim,setAnim]=React.useState(false);
  const [dir,setDir]=React.useState(1);

  const go=(screen)=>{
    if(screen===nav) return;
    setDir(1); setAnim(true);
    setTimeout(()=>{setNav(screen);setStock(null);setAnim(false);},160);
  };
  const openStock=(tk)=>{
    setDir(1); setAnim(true);
    setTimeout(()=>{setStock(tk);setAnim(false);},160);
  };
  const goBack=()=>{
    setDir(-1); setAnim(true);
    setTimeout(()=>{setStock(null);setAnim(false);},160);
  };

  const screenProps={t,accent,onNav:go,onStock:openStock,onToggleDark,onAccent};
  const screens={home:<HomeScreen {...screenProps}/>,watchlist:<WatchlistScreen {...screenProps}/>,portfolio:<PortfolioScreen {...screenProps}/>,discover:<DiscoverScreen {...screenProps}/>,insights:<InsightsScreen {...screenProps}/>};

  return <div style={{width:'100%',height:'100%',background:t.bg,display:'flex',flexDirection:'column',position:'relative',overflow:'hidden'}}>
    <StatusBar dark={dark}/>
    <div style={{flex:1,overflow:'hidden',position:'relative'}}>
      <div style={{height:'100%',overflowY:'auto',overflowX:'hidden',transform:anim?`translateX(${dir*24}px)`:'translateX(0)',opacity:anim?0:1,transition:anim?'none':'transform .2s cubic-bezier(.25,.46,.45,.94),opacity .2s ease'}}>
        {stock
          ? <StockDetailScreen ticker={stock} t={t} accent={accent} onBack={goBack}/>
          : (screens[nav] || screens.home)
        }
      </div>
    </div>
    {!stock&&<TabBar active={nav} onNav={go} t={t} accent={accent}/>}
    {/* Home indicator */}
    <div style={{position:'absolute',bottom:0,left:0,right:0,height:34,display:'flex',justifyContent:'center',alignItems:'flex-end',paddingBottom:8,pointerEvents:'none',zIndex:200}}>
      <div style={{width:139,height:5,borderRadius:100,background:dark?'rgba(255,255,255,.7)':'rgba(0,0,0,.22)'}}/>
    </div>
  </div>;
}

}

// ═══════════════════════════════════════════════════════════
// MAIN: 3-UP CANVAS
// ═══════════════════════════════════════════════════════════
const TWEAK_DEFAULTS_MOBILE = /*EDITMODE-BEGIN*/{
  "accent": "#e07840",
  "darkVariant": false
}/*EDITMODE-END*/;

function Main(){
  const [accent,setAccent]=React.useState(TWEAK_DEFAULTS_MOBILE.accent);
  const [darkB,setDarkB]=React.useState(false);
  const [tweaksOpen,setTweaksOpen]=React.useState(false);

  React.useEffect(()=>{
    const h=e=>{
      if(e.data?.type==='__activate_edit_mode') setTweaksOpen(true);
      if(e.data?.type==='__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return ()=>window.removeEventListener('message',h);
  },[]);

  const W=390,H=844;
  const labels=['Warm Light','Dark Mode','Blue Accent'];

  return <div style={{width:'100vw',height:'100vh',overflow:'auto',background:'#ddd7d0',display:'flex',flexDirection:'column',alignItems:'center',padding:'40px 60px'}}>
    {/* Header */}
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:36,alignSelf:'flex-start'}}>
      <BirdLogo color={accent} size={24}/>
      <span style={{fontSize:13,fontWeight:600,color:'#5a4f47',letterSpacing:.3}}>Perch iOS · 3 Variants</span>
    </div>
    {/* 3 phones side by side */}
    <div style={{display:'flex',gap:48,alignItems:'flex-start',flexWrap:'wrap',justifyContent:'center'}}>
      {[
        {dark:false, a:accent, onToggleDark:()=>{}, onAccent:setAccent},
        {dark:darkB, a:accent, onToggleDark:()=>setDarkB(d=>!d), onAccent:setAccent},
        {dark:false, a:'#3d7be0', onToggleDark:()=>{}, onAccent:()=>{}},
      ].map((cfg,i)=>(
        <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
          <IOSDevice dark={cfg.dark} W={W} H={H}>
            <PerchApp dark={cfg.dark} accent={cfg.a} onToggleDark={cfg.onToggleDark} onAccent={cfg.onAccent}/>
          </IOSDevice>
          <div style={{fontSize:12,fontWeight:600,color:'#7a6f68',letterSpacing:.3}}>{labels[i]}</div>
        </div>
      ))}
    </div>

    {/* Tweaks panel */}
    {tweaksOpen&&<div style={{position:'fixed',bottom:32,right:32,background:'white',borderRadius:18,padding:20,width:240,boxShadow:'0 12px 40px rgba(0,0,0,.18)',border:'1px solid rgba(0,0,0,.08)',zIndex:1000}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <span style={{fontWeight:700,fontSize:14}}>Tweaks</span>
        <button onClick={()=>{setTweaksOpen(false);window.parent.postMessage({type:'__edit_mode_dismissed'},'*');}} style={{background:'none',border:'none',cursor:'pointer',fontSize:20,color:'#aaa',lineHeight:1}}>×</button>
      </div>
      <div style={{fontSize:11,color:'#999',marginBottom:8}}>Accent Color</div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
        {['#e07840','#3d7be0','#3dba78','#9b5de5','#e05c6e','#f0b429'].map(c=><div key={c} onClick={()=>{setAccent(c);window.parent.postMessage({type:'__edit_mode_set_keys',edits:{accent:c}},'*');}} style={{width:28,height:28,borderRadius:14,background:c,cursor:'pointer',border:accent===c?'3px solid white':'3px solid transparent',outline:accent===c?`2px solid ${c}`:'none',boxShadow:'0 1px 4px rgba(0,0,0,.15)'}}/>)}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:13,color:'#333'}}>Dark (center phone)</span>
        <div onClick={()=>setDarkB(d=>!d)} style={{width:44,height:26,borderRadius:13,background:darkB?accent:'#ccc',position:'relative',cursor:'pointer',transition:'background .2s'}}>
          <div style={{position:'absolute',top:3,left:darkB?21:3,width:20,height:20,borderRadius:10,background:'white',transition:'left .2s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}}/>
        </div>
      </div>
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Main/>);
</script>
